name: Quality Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-rag-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Documentation & Build Indexes
        run: |
          python src/ingest.py

      - name: Run Domain Benchmark & Quality Evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python eval/run_eval.py

      - name: Verify Quality Gate Passed
        run: |
          python -c "
          import json
          with open('eval/baseline_scores.json') as f:
              data = json.load(f)
          print('Evaluation Summary:', data)
          if not data.get('target_threshold_met', False):
              print('Quality regression detected: Score below threshold!')
              exit(1)
          print('Quality Gate Passed successfully!')
          "
